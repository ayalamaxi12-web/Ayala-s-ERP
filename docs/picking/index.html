<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Picking Envíos</title>
<style>
:root{--bg:#f4f5f7;--tx:#1b1f24;--card:#fff;--ok:#1a9d57;--dup:#d93025;--warn:#e8a200;--mut:#6b7280}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--tx:#eceff3;--card:#1f2428;--mut:#9aa3ad}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:0 16px 24px}
h1{font-size:20px;margin:16px 0 12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
input,button{font:inherit;border-radius:10px;border:1px solid #8884;padding:12px;width:100%;background:var(--card);color:var(--tx)}
button{background:var(--ok);color:#fff;border:0;font-weight:600;margin-top:8px}
button.sec{background:#8884;color:var(--tx)}
video{width:100%;border-radius:12px;background:#000;aspect-ratio:3/4;object-fit:cover}
#res{border-radius:14px;padding:18px;margin-bottom:12px;color:#fff;display:none;font-size:18px}
#res b{display:block;font-size:24px;margin-bottom:6px}
#res small{display:block;opacity:.95;font-size:14px;margin-top:4px}
.ok{background:var(--ok)}.dup{background:var(--dup)}.err{background:var(--warn);color:#222}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<h1>Picking de envíos</h1>

<div id="login" class="card">
  <label class="mut">Clave de picking</label>
  <input id="clave" type="password" autocomplete="off" placeholder="Clave">
  <label class="mut" style="display:block;margin-top:8px">Tu nombre (opcional)</label>
  <input id="operador" type="text" autocomplete="off" placeholder="Nombre">
  <button id="entrar">Entrar</button>
</div>

<div id="app" style="display:none">
  <div id="res"></div>
  <div class="card">
    <video id="v" playsinline muted></video>
    <p class="mut" id="est">Apuntá la cámara al QR de la etiqueta.</p>
  </div>
  <div class="card">
    <label class="mut">Si el QR no se lee, escribí el número de envío</label>
    <input id="manual" inputmode="numeric" placeholder="Ej: 48418925767">
    <button id="enviarM" class="sec">Registrar</button>
    <button id="salir" class="sec">Cambiar clave / nombre</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const API='https://ayala-s-erp-production.up.railway.app/picking/escanear';
const $=id=>document.getElementById(id);
let clave='',operador='',stream=null,ocupado=false,ultimo='',ultimoT=0,det=null;
function lee(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function guarda(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function borra(k){try{localStorage.removeItem(k)}catch(e){}}

function bip(ok){try{navigator.vibrate&&navigator.vibrate(ok?80:[120,60,120]);
  const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();
  o.frequency.value=ok?880:220;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},ok?120:300)}catch(e){}}

function muestra(cls,titulo,lineas){const r=$('res');r.className=cls;r.style.display='block';
  r.innerHTML='<b></b>'+lineas.map(()=>'<small></small>').join('');
  r.querySelector('b').textContent=titulo;r.querySelectorAll('small').forEach((s,i)=>s.textContent=lineas[i]);}

async function registrar(codigo){
  if(ocupado)return;ocupado=true;$('est').textContent='Registrando…';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Picking-Key':clave},
      body:JSON.stringify({codigo,operador})});
    if(r.status===401){muestra('dup','Clave incorrecta',['Volvé a entrar con la clave de picking.']);bip(false);
      borra('pk_clave');stopCam();$('app').style.display='none';$('login').style.display='block';return}
    if(r.status===503){muestra('err','Picking no habilitado',['Avisale a quien administra el sistema.']);bip(false);return}
    const d=await r.json();
    if(d.estado==='ok'){bip(true);muestra('ok','✔ PICKEADA',['Envío '+d.envio,'Venta '+(d.venta||'—')+' · '+d.cuenta,d.fecha+' '+d.hora+(d.aviso?' · '+d.aviso:'')])}
    else if(d.estado==='duplicada'){bip(false);muestra('dup','✖ YA PICKEADA',['Envío '+d.envio,'Se pickeó el '+d.fecha+' a las '+d.hora+(d.operador?' ('+d.operador+')':''),'No se volvió a registrar.'])}
    else{bip(false);muestra('err','No se pudo leer',[d.mensaje||'Error desconocido'])}
  }catch(e){bip(false);muestra('err','Sin conexión',['Revisá internet y volvé a escanear.'])}
  finally{ocupado=false;$('est').textContent='Apuntá la cámara al QR de la etiqueta.'}
}

function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function startCam(){
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    $('v').srcObject=stream;await $('v').play();
    if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}}
    loop();
  }catch(e){$('est').textContent='No se pudo abrir la cámara. Usá el número de envío a mano.'}
}
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
async function loop(){
  if(!stream)return;
  const v=$('v');
  if(v.videoWidth&&!ocupado){
    let txt='';
    try{
      if(det){const b=await det.detect(v);if(b.length)txt=b[0].rawValue}
      else if(window.jsQR){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
        const im=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(im.data,im.width,im.height);if(q)txt=q.data}
    }catch(e){}
    const t=Date.now();
    if(txt&&(txt!==ultimo||t-ultimoT>4000)){ultimo=txt;ultimoT=t;registrar(txt)}
  }
  setTimeout(loop,250);
}

function entrar(){
  clave=$('clave').value.trim()||lee('pk_clave');operador=$('operador').value.trim();
  if(!clave){return}
  guarda('pk_clave',clave);guarda('pk_op',operador);
  $('login').style.display='none';$('app').style.display='block';startCam();
}
$('entrar').onclick=entrar;
$('enviarM').onclick=()=>{const m=$('manual').value.trim();if(m){registrar(m);$('manual').value=''}};
$('salir').onclick=()=>{stopCam();borra('pk_clave');$('app').style.display='none';$('login').style.display='block'};
$('operador').value=lee('pk_op');
if(lee('pk_clave')){$('clave').value=lee('pk_clave');entrar()}
</script>
</body>
</html>
